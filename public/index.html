<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คำต้องเชื่อม — Word Link</title>
  <style>
    :root { color-scheme: dark; --bg: #0c1020; --panel: rgba(23, 29, 51, .86); --line: rgba(255, 255, 255, .09); --muted: #a3aec7; --text: #f5f7ff; --purple: #a18aff; --mint: #67ebbf; --red: #ff8096; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .panel { border: 1px solid var(--line); background: var(--panel); border-radius: 24px; padding: 24px; max-width: 500px; margin: 40px auto; box-shadow: 0 20px 60px #0002; }
    input, button { width: 100%; padding: 14px; margin-top: 10px; border-radius: 12px; border: 1px solid var(--line); background: #171d33; color: white; font: inherit; }
    button.primary { background: var(--purple); font-weight: bold; cursor: pointer; }
    .muted { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>คำต้องเชื่อม</h2>
    <p class="muted">วางไฟล์ครบแล้ว เตรียมเชื่อมต่อเซิร์ฟเวอร์</p>
    <input id="nameInput" placeholder="ใส่ชื่อของคุณ" maxlength="20">
    <button class="primary" onclick="alert('ระบบพร้อมใช้งานแล้ว หลังจากนำขึ้น Render')">เข้าสู่เกม</button>
  </div>
</body>
</html>
